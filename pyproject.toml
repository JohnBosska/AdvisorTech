[project]
name = "salon-booking-api"
version = "0.2.0"
description = "API онлайн-записи для салона и барбершопа"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "greenlet>=3.5.6",
    "alembic>=1.20.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
