[project]
name = "salon-booking-api"
version = "0.2.0"
description = "API онлайн-записи для салона и барбершопа"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "greenlet>=3.5.6",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "temporalio>=1.34.0",
    "aiosmtplib>=5.1.3",
    "bcrypt>=5.0.0",
    "pyjwt[crypto]>=2.15.1",
    "aiohttp>=3.13.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
